<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>ShepByte Home Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <section id="home-screen" class="screen active">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon">⌂</span>
          <div><small>SHEPBYTE</small><strong>Home Hub</strong><span>Home. Connected.</span></div>
        </div>
        <div class="clock-box"><strong id="clock-mini">--:--</strong><span id="date-mini">--</span></div>
      </header>

      <section class="scene" aria-label="Home Hub node map">
        <svg class="branches" viewBox="0 0 1000 720" preserveAspectRatio="none" aria-hidden="true">
          <path d="M500 360 C415 290 345 230 270 180"></path>
          <path d="M500 360 C390 365 300 410 220 455"></path>
          <path d="M500 360 C425 455 370 535 315 585"></path>
          <path d="M500 360 C585 290 660 230 740 180"></path>
          <path class="warn" d="M500 360 C620 360 720 410 805 455"></path>
          <path class="purple" d="M500 360 C580 455 640 535 700 585"></path>
        </svg>

        <i class="pulse p1"></i><i class="pulse p2"></i><i class="pulse p3"></i>
        <i class="pulse p4"></i><i class="pulse p5"></i><i class="pulse p6"></i>

        <button class="node node-devices" data-node="devices">
          <span class="island tech"><b></b><b></b><b></b></span>
          <span class="label"><strong>Devices</strong><small>0 Online</small></span>
        </button>

        <button class="node node-system" data-node="system">
          <span class="island server"><b></b><b></b><b></b></span>
          <span class="label"><strong>System</strong><small class="ok">Healthy</small></span>
        </button>

        <button class="node node-data" data-node="data">
          <span class="island data"><b></b><b></b><b></b></span>
          <span class="label"><strong>Data</strong><small>History</small></span>
        </button>

        <button class="node node-updates" data-node="updates">
          <span class="island update"><b></b><b></b><b></b></span>
          <span class="label"><strong>Updates</strong><small>Ready</small></span>
        </button>

        <button class="node node-errors" data-node="errors">
          <span class="island error"><b></b><b></b><b></b></span>
          <span class="label"><strong>Errors</strong><small>0 Active</small></span>
        </button>

        <button class="node node-settings" data-node="settings">
          <span class="island settings"><b></b><b></b><b></b></span>
          <span class="label"><strong>Settings</strong><small>Configure</small></span>
        </button>

        <button class="node node-home selected" data-node="home">
          <span class="island home-island">
            <span class="house"><i class="roof"></i><i class="body"></i><i class="window w1"></i><i class="window w2"></i></span>
            <span class="tree t1"></span><span class="tree t2"></span><span class="tree t3"></span>
          </span>
          <span class="hub-label">
            <strong>Home Hub</strong>
            <small><span>Devices <b>0/0</b></span><span>Errors <b>0</b></span></small>
          </span>
        </button>

        <div class="floor"></div>
      </section>

      <div id="panel" class="panel" hidden>
        <button id="close-panel" class="close" aria-label="Close">×</button>
        <small>HOME HUB</small>
        <h2 id="panel-title">Devices</h2>
        <div id="panel-body"></div>
      </div>

      <footer class="hint">Tap a node to focus</footer>
    </section>

    <section id="devices-screen" class="screen detail-screen">
      <button id="back-home" class="back-button">← Home Hub</button>
      <div class="detail-card">
        <small>DEVICES</small>
        <h2>Connected Devices</h2>
        <p>No devices are connected yet.</p>
        <div class="empty-device">
          <span>＋</span>
          <strong>Pair your first ShepByte device</strong>
          <small>The backend pairing flow will populate this view.</small>
        </div>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
